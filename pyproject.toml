[project]
name = "pantryos"
version = "0.1.0"
description = "Local PantryOS app and Home Assistant custom integration for home food intelligence."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
files = ["src", "custom_components/pantryos"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["src/pantryos"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[project.scripts]
pantryos = "pantryos.cli:main"
