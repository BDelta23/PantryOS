services:
  pantryos:
    build:
      context: .
    container_name: pantryos
    environment:
      PANTRYOS_API_TOKEN: ${PANTRYOS_API_TOKEN:?Set PANTRYOS_API_TOKEN before starting PantryOS}
      PANTRYOS_LISTEN_HOST: ${PANTRYOS_LISTEN_HOST:-0.0.0.0}
      PANTRYOS_LISTEN_PORT: 8765
      PANTRYOS_DATABASE_PATH: /data/pantryos.sqlite3
      PANTRYOS_RATE_LIMIT_REQUESTS: ${PANTRYOS_RATE_LIMIT_REQUESTS:-20}
      PANTRYOS_RATE_LIMIT_WINDOW_SECONDS: ${PANTRYOS_RATE_LIMIT_WINDOW_SECONDS:-60}
      PANTRYOS_BROWSER_SESSION_SECONDS: ${PANTRYOS_BROWSER_SESSION_SECONDS:-43200}
      PANTRYOS_BROWSER_SECURE_COOKIES: ${PANTRYOS_BROWSER_SECURE_COOKIES:-false}
      PANTRYOS_DATA_DIR: /data
      PANTRYOS_BACKUP_DIR: /data/backups
    ports:
      - "${PANTRYOS_PORT:-8765}:8765"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 256
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    volumes:
      - pantryos-data:/data
    restart: unless-stopped

volumes:
  pantryos-data:
